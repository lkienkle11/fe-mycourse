name: Frontend browser tests (Playwright)

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev

concurrency:
  group: fe-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run existing quality checks (lint, biome, unit/integration tests, dead code, duplication)
        run: npm run test-all

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser tests (fixture backend + production build + Playwright)
        run: npm run test:e2e

      - name: Upload Playwright report and traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
