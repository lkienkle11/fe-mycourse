# Docker Compose — staging (host port 3001)
name: mycourse-fe-staging

services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_STREAM_SSE_URL: ${NEXT_PUBLIC_STREAM_SSE_URL:-}
        NEXT_PUBLIC_STREAM_WS_URL: ${NEXT_PUBLIC_STREAM_WS_URL:-}
        NEXT_PUBLIC_STREAM_GRPC_BASE_URL: ${NEXT_PUBLIC_STREAM_GRPC_BASE_URL:-}
    image: mycourse-fe:staging
    env_file:
      - ../.env.staging
    environment:
      NODE_ENV: production
      PORT: 3001
    ports:
      - "3001:3001"
